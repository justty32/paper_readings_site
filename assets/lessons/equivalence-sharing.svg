<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1320" role="img" aria-labelledby="title desc"><title id="title">語法樹、等價抽屜與共享子式</title><desc id="desc">左側三棵獨立語法樹表示x+x、2乘x、x乘2。右側結果等價類收納三個運算節點，子邊連到共享X與常數C等價類。一次評估回饋已有等價路徑。對數改寫僅適用x大於零，非EGG-SR全面定義域保證。</desc><style>text{font:22px system-ui,sans-serif;fill:#172d38} .small{font-size:20px} .head{font-weight:700} .box{fill:#f3f6ee;stroke:#57717c;stroke-width:2} .edge{fill:none;stroke:#57717c;stroke-width:2}</style><text x="20" y="35" class="head">分開的語法樹</text><text x="350" y="35" class="head">e-class：結果等價抽屜</text><rect class="box" x="100" y="75" width="60" height="45" rx="10"/><text x="112" y="105.5" class="">+</text><path class="edge" d="M115 120 L60 165 M145 120 L220 165"/><rect class="box" x="32" y="165" width="60" height="42" rx="10"/><text x="44" y="194.0" class="">x</text><rect class="box" x="190" y="165" width="60" height="42" rx="10"/><text x="202" y="194.0" class="">x</text><rect class="box" x="100" y="230" width="60" height="45" rx="10"/><text x="112" y="260.5" class="">×</text><path class="edge" d="M115 275 L60 320 M145 275 L220 320"/><rect class="box" x="32" y="320" width="60" height="42" rx="10"/><text x="44" y="349.0" class="">2</text><rect class="box" x="190" y="320" width="60" height="42" rx="10"/><text x="202" y="349.0" class="">x</text><rect class="box" x="100" y="385" width="60" height="45" rx="10"/><text x="112" y="415.5" class="">×</text><path class="edge" d="M115 430 L60 475 M145 430 L220 475"/><rect class="box" x="32" y="475" width="60" height="42" rx="10"/><text x="44" y="504.0" class="">x</text><rect class="box" x="190" y="475" width="60" height="42" rx="10"/><text x="202" y="504.0" class="">2</text><rect class="box" x="345" y="60" width="335" height="240" rx="15"/><text x="360" y="95" class="small">三個 e-node（運算節點）</text><rect class="box" x="390" y="120" width="225" height="44" rx="10"/><text x="402" y="150.0" class="">+ (X, X)</text><rect class="box" x="390" y="177" width="225" height="44" rx="10"/><text x="402" y="207.0" class="">× (C, X)</text><rect class="box" x="390" y="234" width="225" height="44" rx="10"/><text x="402" y="264.0" class="">× (X, C)</text><path class="edge" d="M405 164 L370 343 L420 400 M450 164 L395 330 L440 400 M495 221 L460 400 M430 278 L480 400 M410 221 L550 365 L585 400 M520 278 L640 365 L625 400"/><rect class="box" x="365" y="400" width="135" height="80" rx="10"/><text x="377" y="448.0" class="">X：{ x }</text><rect class="box" x="550" y="400" width="130" height="80" rx="10"/><text x="562" y="448.0" class="">C：{ 2 }</text><text x="350" y="521" class="small">多條子邊，指向同一子等價類</text><text x="24" y="580" class="head">一次評估 → 共享回饋</text><rect class="box" x="24" y="607" width="650" height="65" rx="10"/><text x="36" y="647.5" class="">實際評估 x+x 一次，取得一份經驗</text><text x="55" y="712" class="">↓ 辨識等價，找樹中已存在的路徑</text><rect class="box" x="24" y="737" width="650" height="65" rx="10"/><text x="36" y="777.5" class="">x+x ／ 2×x ／ x×2 收到共享資訊</text><text x="24" y="839" class="small">不是三次獨立評估；不是憑空新增所有路徑。</text><rect class="box" x="24" y="866" width="650" height="210" rx="10"/><text x="36" y="979.0" class=""></text><text x="42" y="903" class="head">合法實數改寫的門：x &gt; 0</text><text x="42" y="944" class="">log(2x) = log(2) + log(x)</text><text x="42" y="986" class="">×  x ≤ 0：實數 log 不定義，不能通行</text><text x="42" y="1027" class="small">不是浮點逐位相等，也不是取樣證明。</text><text x="24" y="1120" class="small">EGG-SR v2 附錄 A.2：全面強制定義域</text><text x="24" y="1153" class="small">仍是未來工作；此圖不宣稱實作已全面保證。</text><text x="24" y="1210" class="small">圖只示共享概念；省略匹配、合併、抽取等步驟。</text><text x="24" y="1260" class="small">教學示意｜非完整 e-graph 演算法／非實驗結果</text></svg>