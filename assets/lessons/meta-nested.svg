<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1060" role="img" aria-labelledby="title desc"><title id="title">元學習的內外巢狀迴圈</title><desc id="desc">外圈提出更新規則甲與乙。每個規則的內圈都讓代理在直線與轉彎迷宮重新開始，先失敗再練三輪。彙總兩環境後選乙。第三迷宮不參與選法。所有數字為合成。</desc><style>text{font-family:system-ui,sans-serif;fill:#172d38;font-size:24px} .small{font-size:21px} .head{font-weight:700} .box{fill:#f5f7ee;stroke:#47626e;stroke-width:2} .inner{fill:#fff;stroke:#5d7d56;stroke-width:2}</style><rect class="box" x="12" y="12" width="576" height="828" rx="20"/><text class="head" x="32" y="52">外圈：挑選／修改更新規則</text><text class="small" x="32" y="87">候選甲、乙 → 各自進入下方內圈</text><rect class="inner" x="30" y="110" width="540" height="510" rx="16"/><text class="head" x="48" y="151">內圈：固定方法，改代理</text><text x="48" y="197">代理先失敗 → 練習 3 輪</text><text x="48" y="234">→ 策略改變 → 再測失敗數</text><text class="small" x="48" y="282">每個候選、每個環境都重新開始</text><text class="head" x="48" y="332">合成失敗數：練前 → 練後</text><text x="48" y="380">甲｜直線：8 → 1</text><text x="48" y="423">甲｜轉彎：8 → 7</text><text x="48" y="466">乙｜直線：8 → 3</text><text x="48" y="509">乙｜轉彎：8 → 3</text><text class="small" x="48" y="563">此處只畫練前／練後，實際也要</text><text class="small" x="48" y="592">比較整段學習表現與訓練成本。</text><text x="32" y="666">↓ 回報兩個環境的學習表現</text><text x="32" y="709">彙總比較 → 此玩具選乙</text><text class="small" x="32" y="751">甲偏直線；乙在兩環境較均衡</text><text class="small" x="32" y="795">↺ 外圈也可據此再修改方法</text><text class="head" x="32" y="889">選定後，才打開第三座迷宮</text><text x="32" y="933">新代理用乙練習，再評估適應</text><text class="small" x="32" y="975">第三環境結果不回流選法</text><text class="small" x="32" y="1022">教學示意｜全部數字為合成，非實驗</text></svg>