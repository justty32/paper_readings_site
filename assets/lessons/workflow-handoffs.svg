<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">校刊流程的資料交接與兩種修改</title><desc id="desc">找來源、摘錄、撰稿、核對四站傳遞資料卡，紅斷線顯示漏URL，綠色改節點要求，藍色新增原始來源到核對的交接。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f6f8f3"/><g font-family="sans-serif" font-size="20" fill="#172d38"><text x="30" y="40" font-size="27" fill="#172d38">校刊四站：追蹤交出去的資料，才能定位漏來源</text><rect x="35" y="100" width="210" height="75" rx="12" fill="#e6eee4" stroke="#9aaca3" stroke-width="2"/><text x="53" y="145" font-size="24" fill="#172d38">1 找來源</text><rect x="310" y="100" width="210" height="75" rx="12" fill="#e6eee4" stroke="#9aaca3" stroke-width="2"/><text x="328" y="145" font-size="24" fill="#172d38">2 摘錄</text><rect x="585" y="100" width="210" height="75" rx="12" fill="#e6eee4" stroke="#9aaca3" stroke-width="2"/><text x="603" y="145" font-size="24" fill="#172d38">3 撰稿</text><rect x="860" y="100" width="210" height="75" rx="12" fill="#e6eee4" stroke="#9aaca3" stroke-width="2"/><text x="878" y="145" font-size="24" fill="#172d38">4 核對</text><path d="M245 137 H302" fill="none" stroke="#176c63" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M520 137 H577" fill="none" stroke="#176c63" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M795 137 H852" fill="none" stroke="#176c63" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="40" y="200" width="200" height="85" rx="12" fill="#fff7db" stroke="#9aaca3" stroke-width="2"/><text x="52" y="248" font-size="21" fill="#172d38">URL＋原句</text><rect x="315" y="200" width="200" height="85" rx="12" fill="#fff7db" stroke="#9aaca3" stroke-width="2"/><text x="327" y="248" font-size="21" fill="#172d38">含出處摘錄</text><rect x="590" y="200" width="200" height="85" rx="12" fill="#fff7db" stroke="#9aaca3" stroke-width="2"/><text x="602" y="248" font-size="21" fill="#172d38">草稿＋引用</text><rect x="865" y="200" width="200" height="85" rx="12" fill="#fff7db" stroke="#9aaca3" stroke-width="2"/><text x="877" y="248" font-size="21" fill="#172d38">逐項核對結果</text><text x="35" y="325" font-size="23" fill="#b64d48">錯誤交接：摘錄只交句子，漏了 URL</text><path d="M420 295 V365 H690 V295" fill="none" stroke="#b64d48" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="450" y="358" font-size="20" fill="#b64d48">× 缺出處</text><path d="M975 290 V415 H420 V380" fill="none" stroke="#b64d48" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="595" y="405" font-size="20" fill="#b64d48">核對找不到原文 → 回指缺失交接</text><rect x="35" y="465" width="480" height="90" rx="12" fill="#e0eee8" stroke="#176c63" stroke-width="2"/><text x="55" y="502" font-size="23" fill="#176c63">改節點：摘錄必附 URL</text><text x="55" y="532" font-size="20" fill="#172d38">改這一站的要求與輸出內容。</text><rect x="555" y="465" width="515" height="90" rx="12" fill="#e4edf5" stroke="#376e9c" stroke-width="2"/><text x="575" y="502" font-size="23" fill="#376e9c">改邊：原始來源也送核對</text><text x="575" y="532" font-size="20" fill="#172d38">增加資訊交接，不等於多加一個角色。</text><path d="M140 95 V65 H975 V95" fill="none" stroke="#376e9c" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="435" y="87" font-size="20" fill="#376e9c">新增交接：原始來源 → 核對</text><text x="35" y="610" font-size="21" fill="#172d38">教學示意；流程與資料卡為自訂例子，非論文實驗。</text><text x="35" y="647" font-size="20" fill="#172d38">修改後仍用保留題比較品質、漏引、成本與耗時，不能只看圖就判定變好。</text><text x="35" y="681" font-size="20" fill="#172d38">GPTSwarm 的邊優化主要是跨 agent 連線，非任意內部拓樸的自動搜尋。</text></g></svg>
