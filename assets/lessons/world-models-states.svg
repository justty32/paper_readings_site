<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc"><title id="title">積木世界的狀態與非法轉移</title><desc id="desc">手空才能拿紅，放下回手空；手拿紅時再拿藍被拒絕，漏前提則出現同手兩塊的錯誤狀態。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f6f8f3"/><g font-family="sans-serif" font-size="20" fill="#172d38"><text x="30" y="38" font-size="27" fill="#172d38">一手一塊：前置條件決定哪條箭頭能走</text><rect x="35" y="95" width="270" height="220" rx="12" fill="#fff" stroke="#9aaca3" stroke-width="2"/><text x="50" y="125" font-size="23" fill="#172d38">S0｜手空、紅藍在桌上</text><path d="M79 209 L74 178 Q74 171 81 174 L92 193 V156 Q97 145 102 156 V184 V147 Q108 137 113 147 V184 V154 Q119 144 124 154 V187 V165 Q132 155 136 167 V208 Q133 226 126 230 V242 H93 V229 Z" fill="#f3d6b5" stroke="#172d38" stroke-width="2"/><path d="M55 290 H285" stroke="#172d38" stroke-width="4"/><rect x="155" y="250" width="40" height="40" rx="4" fill="#e47b6a" stroke="#172d38" stroke-width="2"/><rect x="215" y="250" width="40" height="40" rx="4" fill="#699fc6" stroke="#172d38" stroke-width="2"/><text x="50" y="270" font-size="18" fill="#172d38">手：空</text><rect x="510" y="95" width="270" height="220" rx="12" fill="#fff" stroke="#9aaca3" stroke-width="2"/><text x="525" y="125" font-size="23" fill="#172d38">S1｜手拿紅、藍在桌上</text><path d="M554 209 L549 178 Q549 171 556 174 L567 193 V156 Q572 145 577 156 V184 V147 Q583 137 588 147 V184 V154 Q594 144 599 154 V187 V165 Q607 155 611 167 V208 Q608 226 601 230 V242 H568 V229 Z" fill="#f3d6b5" stroke="#172d38" stroke-width="2"/><path d="M530 290 H760" stroke="#172d38" stroke-width="4"/><rect x="630" y="180" width="40" height="40" rx="4" fill="#e47b6a" stroke="#172d38" stroke-width="2"/><rect x="690" y="250" width="40" height="40" rx="4" fill="#699fc6" stroke="#172d38" stroke-width="2"/><text x="525" y="270" font-size="18" fill="#172d38">手：紅</text><path d="M310 165 H500" fill="none" stroke="#176c63" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="328" y="125" font-size="23" fill="#172d38">拿紅</text><text x="320" y="150" font-size="18" fill="#172d38">前提：手空</text><path d="M510 280 Q410 365 300 280" fill="none" stroke="#176c63" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="345" y="337" font-size="19" fill="#172d38">放下紅 → 回 S0</text><path d="M650 320 V395" fill="none" stroke="#b64d48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="675" y="355" font-size="21" fill="#b64d48">再拿藍：拒絕 ×</text><text x="675" y="382" font-size="18" fill="#b64d48">因為手不空</text><rect x="510" y="440" width="270" height="220" rx="12" fill="#fff" stroke="#9aaca3" stroke-width="2"/><text x="525" y="470" font-size="23" fill="#172d38">錯誤模型｜同手紅＋藍</text><path d="M554 554 L549 523 Q549 516 556 519 L567 538 V501 Q572 490 577 501 V529 V492 Q583 482 588 492 V529 V499 Q594 489 599 499 V532 V510 Q607 500 611 512 V553 Q608 571 601 575 V587 H568 V574 Z" fill="#f3d6b5" stroke="#172d38" stroke-width="2"/><path d="M530 635 H760" stroke="#172d38" stroke-width="4"/><rect x="630" y="525" width="40" height="40" rx="4" fill="#e47b6a" stroke="#172d38" stroke-width="2"/><rect x="690" y="525" width="40" height="40" rx="4" fill="#699fc6" stroke="#172d38" stroke-width="2"/><text x="525" y="615" font-size="18" fill="#172d38">手：紅＋藍</text><path d="M780 210 H1020 V540 H790" fill="none" stroke="#b64d48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="820" y="250" font-size="20" fill="#b64d48">漏掉「手空」前提</text><text x="820" y="280" font-size="20" fill="#b64d48">錯規則允許再拿藍</text><text x="35" y="490" font-size="20" fill="#172d38">正確模型：S1 沒有合法「拿藍」轉移。</text><text x="35" y="525" font-size="20" fill="#172d38">錯誤在規則，規劃器可能照錯規則走。</text><text x="35" y="710" font-size="21" fill="#172d38">教學示意：一手一塊的離散玩具；非機器人／物理保證。</text><text x="35" y="744" font-size="21" fill="#172d38">未提供完整感知、連續運動或控制成功保證。</text></g></svg>
