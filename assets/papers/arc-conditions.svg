<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">ARC：高分之外，三個條件要分開看</title><desc id="desc">先驗是任務前的能力；經驗是接觸任務後的新資訊；泛化難度是跨到新情況尚需的結構。比較須固定範圍、接觸史與協定，沒有在此捏造智慧評分。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">ARC：高分之外，三個條件要分開看</text><rect x="30" y="105" width="250" height="220" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="48" y="146" font-size="27" fill="#172d38" text-anchor="start">先驗</text><text x="48" y="184" font-size="17" fill="#172d38" text-anchor="start">接觸題目前已帶著什麼？</text><text x="48" y="234" font-size="19" fill="#172d38" text-anchor="start">例如：辨認相鄰格子、</text><text x="48" y="268" font-size="19" fill="#172d38" text-anchor="start">表示旋轉、偏好短規則</text><rect x="325" y="105" width="250" height="220" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="343" y="146" font-size="27" fill="#172d38" text-anchor="start">經驗</text><text x="343" y="184" font-size="17" fill="#172d38" text-anchor="start">接觸題目後新得到什麼？</text><text x="343" y="234" font-size="19" fill="#172d38" text-anchor="start">例如：示範 A、B 的</text><text x="343" y="268" font-size="19" fill="#172d38" text-anchor="start">輸入與輸出配對</text><rect x="620" y="105" width="250" height="220" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="638" y="146" font-size="27" fill="#172d38" text-anchor="start">泛化難度</text><text x="638" y="184" font-size="17" fill="#172d38" text-anchor="start">跨到新情況還缺什麼？</text><text x="638" y="234" font-size="19" fill="#172d38" text-anchor="start">例如：把規則搬到</text><text x="638" y="268" font-size="19" fill="#172d38" text-anchor="start">起點不同的待測 C</text><rect x="30" y="350" width="840" height="85" rx="16" fill="#eff3df" stroke="#b7c5be"/><text x="50" y="384" font-size="23" fill="#172d38" text-anchor="start">先固定任務範圍、接觸史與評估協定，再比較表現。</text><text x="50" y="417" font-size="19" fill="#172d38" text-anchor="start">答對率不是直接可算的「智慧分數」；原始 ARC 未完成整套形式量測。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>