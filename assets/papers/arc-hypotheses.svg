<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">ARC：示範都答對，測試卻可能分歧</title><desc id="desc">示範 A 輸入背景XX背景背景，輸出背景XXX背景；B 輸入XXX背景背景背景，輸出XXXX背景背景。C 輸入背景背景XX背景背景，延長規則改第5格，固定第4格規則不變。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">ARC：示範都答對，測試卻可能分歧</text><text x="30" y="83" font-size="22" fill="#172d38" text-anchor="start">兩條候選規則：① 連續 X 向右延長一格　② 第 4 格改成 X</text><text x="30" y="136" font-size="22" fill="#172d38" text-anchor="start">示範 A</text><rect x="150" y="110" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="188" y="110" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="226" y="110" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="264" y="110" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="302" y="110" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><path d="M400 127 L460 127" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="110" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="528" y="110" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="566" y="110" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="604" y="110" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="642" y="110" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><text x="755" y="136" font-size="18" fill="#172d38" text-anchor="start">兩規則皆符合</text><text x="30" y="216" font-size="22" fill="#172d38" text-anchor="start">示範 B</text><rect x="150" y="190" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="188" y="190" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="226" y="190" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="264" y="190" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="302" y="190" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="340" y="190" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><path d="M400 207 L460 207" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="190" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="528" y="190" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="566" y="190" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="604" y="190" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="642" y="190" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="680" y="190" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><text x="755" y="216" font-size="18" fill="#172d38" text-anchor="start">兩規則皆符合</text><text x="30" y="285" font-size="22" fill="#172d38" text-anchor="start">待測 C</text><rect x="150" y="260" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="188" y="260" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="226" y="260" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="264" y="260" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="302" y="260" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="340" y="260" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><text x="450" y="285" font-size="21" fill="#172d38" text-anchor="start">同樣輸入，預測開始分歧</text><text x="30" y="345" font-size="22" fill="#172d38" text-anchor="start">① 延長</text><rect x="150" y="320" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="188" y="320" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="226" y="320" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="264" y="320" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="302" y="320" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="340" y="320" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><text x="450" y="345" font-size="22" fill="#172d38" text-anchor="start">第 5 格變 X</text><text x="30" y="405" font-size="18" fill="#172d38" text-anchor="start">② 固定第 4 格</text><rect x="150" y="380" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="188" y="380" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="226" y="380" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="264" y="380" width="34" height="34" rx="3" fill="#426e63" stroke="#9aaba2"/><rect x="302" y="380" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><rect x="340" y="380" width="34" height="34" rx="3" fill="#fffef8" stroke="#9aaba2"/><text x="450" y="405" font-size="21" fill="#172d38" text-anchor="start">第 4 格原本就是 X，保持原樣</text><text x="30" y="441" font-size="20" fill="#172d38" text-anchor="start">深綠 = X；淺色 = 背景。有限示範不會唯一決定所有新題。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>