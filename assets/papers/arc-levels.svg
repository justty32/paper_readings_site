<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">ARC：資料集準備，與新題現場學規則</title><desc id="desc">資料集外框分成訓練任務群與評估任務群。放大評估群中一個新任務T，其內仍給示範A、B的輸入輸出，再要求構造待測C的輸出。兩層訓練不可混為一談。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">ARC：資料集準備，與新題現場學規則</text><rect x="25" y="72" width="850" height="128" rx="14" fill="none" stroke="#536873" stroke-width="2"/><text x="45" y="102" font-size="23" fill="#172d38" text-anchor="start">第一層：整個原始 ARC 資料集</text><rect x="45" y="119" width="345" height="59" fill="#dce8df"/><text x="65" y="144" font-size="22" fill="#172d38" text-anchor="start">訓練任務群</text><text x="65" y="169" font-size="18" fill="#172d38" text-anchor="start">供開發者熟悉、開發系統</text><rect x="420" y="119" width="430" height="59" fill="#eff3df"/><text x="440" y="144" font-size="22" fill="#172d38" text-anchor="start">評估任務群：每題可有不同規則</text><text x="440" y="169" font-size="18" fill="#172d38" text-anchor="start">其中一個新任務 T</text><circle cx="800" cy="149" r="18" fill="#426e63"/><text x="800" y="156" font-size="20" fill="#fffef8" text-anchor="middle">T</text><path d="M782 167 L55 222 M818 167 L845 222" stroke="#426e63" stroke-width="2" stroke-dasharray="7 5"/><rect x="35" y="225" width="830" height="210" rx="14" fill="#fffef8" stroke="#426e63" stroke-width="3"/><text x="55" y="258" font-size="23" fill="#172d38" text-anchor="start">第二層：放大新評估任務 T，仍有自己的示範</text><rect x="55" y="281" width="480" height="126" fill="#dce8df"/><text x="75" y="310" font-size="23" fill="#172d38" text-anchor="start">現場可讀：示範 A、B</text><text x="75" y="347" font-size="21" fill="#172d38" text-anchor="start">A：已知輸入 → 已知輸出</text><text x="75" y="383" font-size="21" fill="#172d38" text-anchor="start">B：已知輸入 → 已知輸出</text><rect x="555" y="281" width="290" height="126" fill="#eff3df"/><text x="575" y="310" font-size="23" fill="#172d38" text-anchor="start">本題待測 C</text><text x="575" y="347" font-size="21" fill="#172d38" text-anchor="start">給定新輸入</text><text x="575" y="383" font-size="20" fill="#172d38" text-anchor="start">輸出：由受測者構造 ？</text><text x="40" y="456" font-size="19" fill="#172d38" text-anchor="start">2019 原始 ARC 概念示意；不是後來競賽的規則圖。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>