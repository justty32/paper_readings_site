<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">保留舊分支與只留冠軍的版本樹</title><desc id="desc">自編教學示意。左樹A分出B與當前較好的D，B仍可被選回並可能產生C；右樹只留D，B分支中止。這不是保證C會勝出，也不表示其他路找不到C。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53687a"/></marker></defs><style>text{font-family:system-ui,'Noto Sans TC',sans-serif;font-size:22px;fill:#19354b}.small{font-size:18px}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.edge{stroke:#53687a;stroke-width:3;fill:none;marker-end:url(#arrow)}.node{fill:#edf3fa;stroke:#567798;stroke-width:2}.green{fill:#e1f1e8;stroke:#368260;stroke-width:2}.fixed{fill:#edf0f3;stroke:#657887;stroke-width:2}.warm{fill:#faf0da;stroke:#a48a4e;stroke-width:2}</style><rect width="1000" height="700" rx="20" fill="#fafcfd"/>
<text x="30" y="43" class="title">暫時沒贏，不等於永遠沒用</text><text x="30" y="77" class="small">自編版本樹示意；沒有實驗分數，虛線表示未保留的分支</text>
<text x="80" y="132" class="label">Archive：仍可回選舊版本</text><text x="590" y="132" class="label">只留當前冠軍</text>
<path class="edge" d="M270 235L140 320"/><path class="edge" d="M290 235L400 320"/><path class="edge" d="M140 410V505"/>
<rect class="node" x="180" y="165" width="200" height="75" rx="15"/><text x="280" y="197" text-anchor="middle">A：按行讀檔</text><text x="280" y="225" text-anchor="middle" class="small">初始工具</text>
<rect class="warm" x="40" y="330" width="220" height="85" rx="15"/><text x="150" y="365" text-anchor="middle">B：改前測試</text><text x="150" y="397" text-anchor="middle" class="small">暫未勝出、略慢</text>
<rect class="green" x="310" y="330" width="190" height="85" rx="15"/><text x="405" y="365" text-anchor="middle">D：另一分支</text><text x="405" y="397" text-anchor="middle" class="small">當前較好</text>
<rect class="green" x="40" y="520" width="240" height="85" rx="15"/><text x="160" y="554" text-anchor="middle">C：失敗日誌定位</text><text x="160" y="587" text-anchor="middle" class="small">可能的後續功能</text>
<path class="edge" d="M430 425C530 525 540 290 270 375"/><text x="395" y="490" text-anchor="middle" class="small">D 較好，仍可回選 B</text>
<path class="edge" d="M770 235L850 320"/><path d="M750 235L650 320" stroke="#b7b7b7" stroke-width="3" stroke-dasharray="8 6"/>
<rect class="node" x="670" y="165" width="200" height="75" rx="15"/><text x="770" y="210" text-anchor="middle">A</text>
<rect x="560" y="330" width="160" height="85" rx="15" fill="#f3f3f3" stroke="#a3a3a3" stroke-dasharray="8 6"/><text x="640" y="366" text-anchor="middle">B 不保留</text>
<rect class="green" x="760" y="330" width="190" height="85" rx="15"/><text x="855" y="380" text-anchor="middle">D 保留</text>
<text x="580" y="510">B 這條路無法再選</text><text x="580" y="548">不等於其他路找不到 C</text>
<text x="30" y="680" class="small">踏腳石是機會，不是保證；保留 B 也可能一直沒有收益。</text>
</svg>
