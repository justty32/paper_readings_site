<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">固定模型與可修改代理程式的層次</title><desc id="desc">教學示意。外部archive維護與親代選擇固定，模型權重凍結；代理自己的提示、工具與工作流程程式可修改。外部題目與判分為本圖邊界，不宣稱所有harness程式不可改。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53687a"/></marker></defs><style>text{font-family:system-ui,'Noto Sans TC',sans-serif;font-size:22px;fill:#19354b}.small{font-size:18px}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.edge{stroke:#53687a;stroke-width:3;fill:none;marker-end:url(#arrow)}.node{fill:#edf3fa;stroke:#567798;stroke-width:2}.green{fill:#e1f1e8;stroke:#368260;stroke-width:2}.fixed{fill:#edf0f3;stroke:#657887;stroke-width:2}.warm{fill:#faf0da;stroke:#a48a4e;stroke-width:2}</style><rect width="1000" height="640" rx="20" fill="#fafcfd"/>
<text x="30" y="43" class="title">自我修改，有清楚的層次邊界</text><text x="30" y="77" class="small">教學示意，非作者實驗數據；鎖住模型權重，不代表整個系統都不能改</text>
<rect class="fixed" x="45" y="110" width="910" height="475" rx="22"/><text x="75" y="153" class="label">固定：archive 維護、親代選擇流程</text><path d="M885 150v-17a12 12 0 0 1 24 0v17" fill="none" stroke="#52677a" stroke-width="4"/><rect x="879" y="148" width="36" height="30" rx="5" fill="#52677a"/>
<rect class="green" x="90" y="190" width="820" height="255" rx="20"/><text x="120" y="233" class="label">可修改：代理自己的 Python 程式庫</text>
<rect class="node" x="125" y="270" width="210" height="105" rx="14"/><rect class="node" x="395" y="270" width="210" height="105" rx="14"/><rect class="node" x="665" y="270" width="210" height="105" rx="14"/>
<text x="230" y="310" text-anchor="middle">提示</text><text x="230" y="348" text-anchor="middle" class="small">怎麼描述任務</text><text x="500" y="310" text-anchor="middle">工具</text><text x="500" y="348" text-anchor="middle" class="small">讀寫與執行方式</text><text x="770" y="310" text-anchor="middle">工作流程</text><text x="770" y="348" text-anchor="middle" class="small">先測試、再定位</text>
<path class="edge" d="M230 380V470"/><path class="edge" d="M500 380V470"/><path class="edge" d="M770 380V470"/>
<rect class="fixed" x="95" y="480" width="810" height="68" rx="14"/><text x="500" y="522" text-anchor="middle" class="label">凍結基礎模型 FM：呼叫它，不更新權重</text>
<text x="45" y="616" class="small">外部題目／判分是研究者的比較邊界；v3 的部分 evaluation harnesses 可屬修改範圍。</text>
</svg>
