<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">DreamCoder：工具定義也要算成本</title><desc id="desc">自訂格數同比例色塊。兩個舊解各12，共24；新定義10加兩次使用各4，共18。若只有一題，新14比舊12大。定義含本體與參數宣告，使用含呼叫與本題運算引數。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">DreamCoder：工具定義也要算成本</text><text x="30" y="79" font-size="21" fill="#172d38" text-anchor="start">自訂成本單位「格」；長度同比例，每格 25 像素。</text><text x="30" y="121" font-size="23" fill="#172d38" text-anchor="start">兩題：舊寫法 24 = 12 + 12</text><rect x="30" y="140" width="300" height="38" fill="#6d9291"/><rect x="330" y="140" width="300" height="38" fill="#9bb8ae"/><text x="180" y="167" font-size="20" fill="#fffef8" text-anchor="middle">A：12</text><text x="480" y="167" font-size="20" fill="#172d38" text-anchor="middle">B：12</text><text x="30" y="215" font-size="23" fill="#172d38" text-anchor="start">兩題：新寫法 18 = 10 + 4 + 4</text><rect x="30" y="234" width="250" height="38" fill="#d5f27c"/><rect x="280" y="234" width="100" height="38" fill="#6d9291"/><rect x="380" y="234" width="100" height="38" fill="#9bb8ae"/><text x="155" y="261" font-size="20" fill="#172d38" text-anchor="middle">定義：10</text><text x="330" y="261" font-size="20" fill="#fffef8" text-anchor="middle">A：4</text><text x="430" y="261" font-size="20" fill="#172d38" text-anchor="middle">B：4</text><text x="30" y="310" font-size="23" fill="#172d38" text-anchor="start">單題對照：新寫法 14，比舊寫法 12 還多</text><rect x="30" y="328" width="300" height="28" fill="#6d9291"/><text x="350" y="351" font-size="20" fill="#172d38" text-anchor="start">舊：12</text><rect x="30" y="369" width="250" height="28" fill="#d5f27c"/><rect x="280" y="369" width="100" height="28" fill="#6d9291"/><text x="400" y="392" font-size="20" fill="#172d38" text-anchor="start">新：10 + 4 = 14</text><text x="30" y="427" font-size="20" fill="#172d38" text-anchor="start">定義 10：工具本體＋參數宣告；使用 4：呼叫＋本題運算引數。</text><text x="30" y="451" font-size="19" fill="#172d38" text-anchor="start">重用才可能抵銷定義成本；這些格數不是原論文數值。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>