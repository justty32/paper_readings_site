<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">DreamCoder：兩種學習，回到下一輪搜尋</title><desc id="desc">Wake 用庫與識別器引導搜尋並檢查解；抽象更新庫；作夢與真題重播訓練識別器。兩者回饋下一輪，並不保證解題成功。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">DreamCoder：兩種學習，回到下一輪搜尋</text><rect x="30" y="85" width="390" height="130" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="50" y="120" font-size="24" fill="#172d38" text-anchor="start">① Wake：找題目的解</text><text x="50" y="155" font-size="21" fill="#172d38" text-anchor="start">函式庫 L：提供可用積木</text><text x="50" y="187" font-size="21" fill="#172d38" text-anchor="start">識別器 Q：建議先搜哪些組合</text><path d="M425 150 L475 150" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="85" width="385" height="130" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="505" y="120" font-size="24" fill="#172d38" text-anchor="start">② 抽象：整理已找到的解</text><text x="505" y="155" font-size="21" fill="#172d38" text-anchor="start">重構共通結構，衡量壓縮代價</text><text x="505" y="187" font-size="21" fill="#172d38" text-anchor="start">更新函式庫 L，例如加入 map</text><path d="M680 220 L680 265" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="275" width="385" height="130" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="505" y="310" font-size="24" fill="#172d38" text-anchor="start">③ 作夢：練習搜尋方向</text><text x="505" y="345" font-size="20" fill="#172d38" text-anchor="start">從 L 抽程式 → 執行成假想題</text><text x="505" y="377" font-size="20" fill="#172d38" text-anchor="start">混入真題重播，訓練識別器 Q</text><path d="M480 340 L425 340" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="275" width="390" height="130" rx="16" fill="#eff3df" stroke="#b7c5be"/><text x="50" y="310" font-size="24" fill="#172d38" text-anchor="start">④ 下一輪 Wake</text><text x="50" y="345" font-size="21" fill="#172d38" text-anchor="start">L 讓程式表達更短</text><text x="50" y="377" font-size="20" fill="#172d38" text-anchor="start">Q 改善搜尋順序；仍須執行驗證</text><path d="M225 270 L225 220" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>