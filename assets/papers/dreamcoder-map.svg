<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">DreamCoder：保留遞迴骨架，只換單項運算</title><desc id="desc">兩段遞迴都取首項、處理尾部並組回。map 把乘二或減一抽成參數 f；空串列回傳空串列。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">DreamCoder：保留遞迴骨架，只換單項運算</text><rect x="25" y="70" width="410" height="130" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="45" y="103" font-size="22" fill="#172d38" text-anchor="start">A：逐項乘二</text><text x="45" y="140" font-size="26" fill="#172d38" text-anchor="start">[1, 3] → [2, 6]</text><text x="45" y="177" font-size="18" fill="#172d38" text-anchor="start">每次取首項、乘二、遞迴處理尾部</text><rect x="465" y="70" width="410" height="130" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="485" y="103" font-size="22" fill="#172d38" text-anchor="start">B：逐項減一</text><text x="485" y="140" font-size="26" fill="#172d38" text-anchor="start">[1, 3] → [0, 2]</text><text x="485" y="177" font-size="18" fill="#172d38" text-anchor="start">每次取首項、減一、遞迴處理尾部</text><path d="M230 205 L330 235" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><path d="M670 205 L570 235" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="245" width="700" height="100" rx="16" fill="#eff3df" stroke="#b7c5be"/><text x="125" y="277" font-size="22" fill="#172d38" text-anchor="start">共同骨架：map(f, xs)</text><text x="125" y="308" font-size="21" fill="#172d38" text-anchor="start">空串列 → []；否則取首項交給 f，再處理尾部</text><text x="125" y="335" font-size="20" fill="#172d38" text-anchor="start">最後把 f(首項) 與處理好的尾部組回串列</text><text x="70" y="392" font-size="22" fill="#172d38" text-anchor="start">換 f，走訪與組回都不變：</text><text x="70" y="429" font-size="22" fill="#172d38" text-anchor="start">f(z)=2z → A     f(z)=z−1 → B     f(z)=z+3 → 新組合</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>