<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">候選執行通過指標，才成為示範來源</title><desc id="desc">在訓練題上執行teacher，記錄多階段軌跡，經指標篩選後拆為各模組示範。通過最後答案指標不保證每步正確。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536980"/></marker></defs><rect width="1000" height="660" rx="22" fill="#f4f7fb"/><g font-family="system-ui,sans-serif" fill="#18334b"><text x="36" y="44" font-size="27" font-weight="700">候選執行通過指標，才成為示範來源</text><text x="36" y="78" font-size="19">教學示意；非原論文實驗結果，不代表今日 API。</text><path d="M295 190 L365 190" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 190 L705 190" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 260 L300 355" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M430 430 L555 430" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="120" width="260" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="154" font-size="22" font-weight="700">訓練輸入</text><text x="53" y="184" font-size="19" font-weight="400">teacher 試做候選</text><text x="53" y="214" font-size="19" font-weight="400">或用零樣本程式</text><rect x="365" y="120" width="270" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="383" y="154" font-size="22" font-weight="700">記錄執行軌跡</text><text x="383" y="184" font-size="19" font-weight="400">查詢1 → 作者</text><text x="383" y="214" font-size="19" font-weight="400">查詢2 → 人物資料</text><text x="383" y="244" font-size="19" font-weight="400">最後回答國家</text><rect x="705" y="120" width="260" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="723" y="154" font-size="22" font-weight="700">指標篩選</text><text x="723" y="184" font-size="19" font-weight="400">預先定義接受標準</text><text x="723" y="214" font-size="19" font-weight="400">未通過：丟棄候選</text><rect x="90" y="355" width="340" height="150" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="108" y="389" font-size="22" font-weight="700">接受的軌跡拆開</text><text x="108" y="419" font-size="19" font-weight="400">模組1的輸入／輸出</text><text x="108" y="449" font-size="19" font-weight="400">模組2的輸入／輸出</text><text x="108" y="479" font-size="19" font-weight="400">回答模組的輸入／輸出</text><rect x="555" y="355" width="370" height="150" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="573" y="389" font-size="22" font-weight="700">回填候選示範</text><text x="573" y="419" font-size="19" font-weight="400">各步放回對應模組</text><text x="573" y="449" font-size="19" font-weight="400">再比較示範組合配置</text><text x="573" y="479" font-size="19" font-weight="400">不必手標每個中間步驟</text><text x="36" y="570" font-size="19">教學示意：通過最後答案指標，不保證中間每步都正確。</text><text x="36" y="600" font-size="19">方法定位：原文第 4 節；仍需要可用、合適的指標。</text></g></svg>