<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">資料怎麼流？規格卡先說清楚要交什麼</title><desc id="desc">虛構作品先經一次檢索取得作者，第二次檢索取得出生地與國家。下排區分簽章、模組與編譯器。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536980"/></marker></defs><rect width="1000" height="660" rx="22" fill="#f4f7fb"/><g font-family="system-ui,sans-serif" fill="#18334b"><text x="36" y="44" font-size="27" font-weight="700">資料怎麼流？規格卡先說清楚要交什麼</text><text x="36" y="78" font-size="19">教學示意；非原論文實驗結果，不代表今日 API。</text><path d="M240 190 L275 190" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 190 L515 190" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 190 L755 190" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="120" width="205" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="154" font-size="22" font-weight="700">問題</text><text x="53" y="184" font-size="19" font-weight="400">《月光郵局》作者</text><text x="53" y="214" font-size="19" font-weight="400">出生於哪個國家？</text><rect x="275" y="120" width="205" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="293" y="154" font-size="22" font-weight="700">檢索第一跳</text><text x="293" y="184" font-size="19" font-weight="400">資料卡 A</text><text x="293" y="214" font-size="19" font-weight="400">作者：林禾</text><rect x="515" y="120" width="205" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="533" y="154" font-size="22" font-weight="700">檢索第二跳</text><text x="533" y="184" font-size="19" font-weight="400">資料卡 B</text><text x="533" y="214" font-size="19" font-weight="400">林禾生於松港</text><text x="533" y="244" font-size="19" font-weight="400">松港在青岬國</text><rect x="755" y="120" width="205" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="773" y="154" font-size="22" font-weight="700">回答</text><text x="773" y="184" font-size="19" font-weight="400">青岬國</text><text x="773" y="214" font-size="19" font-weight="400">兩次檢索完成</text><rect x="35" y="350" width="280" height="150" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="384" font-size="22" font-weight="700">signature 規格卡</text><text x="53" y="414" font-size="19" font-weight="400">輸入：問題、已知內容</text><text x="53" y="444" font-size="19" font-weight="400">輸出：搜尋查詢</text><rect x="360" y="350" width="280" height="150" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="378" y="384" font-size="22" font-weight="700">module 做一步</text><text x="378" y="414" font-size="19" font-weight="400">生成查詢或檢索</text><text x="378" y="444" font-size="19" font-weight="400">人把各步接成流程</text><rect x="685" y="350" width="280" height="150" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="703" y="384" font-size="22" font-weight="700">compiler 調參</text><text x="703" y="414" font-size="19" font-weight="400">主要挑選示範</text><text x="703" y="444" font-size="19" font-weight="400">不是任意改整張圖</text><text x="36" y="570" font-size="19">本圖人物、作品與地名皆虛構；第二張卡同時含出生地與國家。</text><text x="36" y="600" font-size="19">方法定位：原文 3.1–3.3、7。</text></g></svg>