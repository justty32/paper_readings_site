<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">三份資料，各有不同任務</title><desc id="desc">訓練資料產生候選，開發驗證資料選配置，測試資料只能在設定確定後評估；禁止使用測試答案選參數或示範。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536980"/></marker></defs><rect width="1000" height="660" rx="22" fill="#f4f7fb"/><g font-family="system-ui,sans-serif" fill="#18334b"><text x="36" y="44" font-size="27" font-weight="700">三份資料，各有不同任務</text><text x="36" y="78" font-size="19">教學示意；非原論文實驗結果，不代表今日 API。</text><path d="M315 250 L360 250" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 250 L685 250" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="150" width="280" height="210" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="184" font-size="22" font-weight="700">訓練 train</text><text x="53" y="214" font-size="19" font-weight="400">試做候選軌跡</text><text x="53" y="244" font-size="19" font-weight="400">產生各模組示範</text><text x="53" y="274" font-size="19" font-weight="400">提供搜尋材料</text><rect x="360" y="150" width="280" height="210" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="378" y="184" font-size="22" font-weight="700">開發 dev</text><text x="378" y="214" font-size="19" font-weight="400">比較候選配置</text><text x="378" y="244" font-size="19" font-weight="400">挑選示範組合</text><text x="378" y="274" font-size="19" font-weight="400">設定到這裡確定</text><rect x="685" y="150" width="280" height="210" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="703" y="184" font-size="22" font-weight="700">測試 test</text><text x="703" y="214" font-size="19" font-weight="400">保留到設定確定後</text><text x="703" y="244" font-size="19" font-weight="400">只評估未見題表現</text><text x="703" y="274" font-size="19" font-weight="400">不能拿來選參數</text><rect x="80" y="420" width="840" height="100" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="98" y="454" font-size="22" font-weight="700">禁止回流：測試答案不能拿去挑提示、示範或參數</text><text x="98" y="484" font-size="19" font-weight="400">模型權重不變，也不代表沒有透過示範挑選學習。</text><text x="36" y="570" font-size="19">三分區為教學設計；原文亦允許訓練集內交叉驗證。</text><text x="36" y="600" font-size="19">原文定位：4、6–7；不是論文實驗結果圖。</text></g></svg>