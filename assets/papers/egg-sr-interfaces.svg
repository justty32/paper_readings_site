<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Egg核心連接三種學習介面</title><desc id="desc">方法介面教學示意。左方同一Egg核心先建圖、改寫合併並抽取代表式；三條線分別接到MCTS搜尋統計、DRL學習目標、LLM下一輪提示，各泳道回饋的位置不同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#54677c"/></marker></defs><style>text{font-family:system-ui,'Noto Sans TC',sans-serif;font-size:22px;fill:#19354b}.small{font-size:18px}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.edge{stroke:#54677c;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.plain{stroke:#54677c;stroke-width:2.5;fill:none}.node{fill:#edf3f9;stroke:#527599;stroke-width:2}.green{fill:#e0f2e9;stroke:#2e805f;stroke-width:2}.class{fill:#f4f8fd;stroke:#53799f;stroke-dasharray:8 5;stroke-width:2}</style><rect width="1000" height="680" rx="20" fill="#fafcfd"/>
<text x="30" y="43" class="title">同一個 Egg，接回三個不同地方</text><text x="30" y="76" class="small">方法介面教學示意，非實驗數據；主線追 MCTS，其餘為深讀支線</text>
<rect x="365" y="110" width="605" height="155" rx="18" fill="#e4f2e8"/><rect x="365" y="290" width="605" height="155" rx="18" fill="#edf2fa"/><rect x="365" y="470" width="605" height="155" rx="18" fill="#f6efdf"/>
<rect class="node" x="35" y="220" width="260" height="280" rx="22"/><text x="165" y="265" text-anchor="middle" class="label">共用 Egg 核心</text>
<path class="edge" d="M165 300V325"/><text x="165" y="300" text-anchor="middle">表達式建圖</text><text x="165" y="360" text-anchor="middle">匹配、改寫、合併</text><path class="edge" d="M165 380V410"/><text x="165" y="451" text-anchor="middle">抽取等價代表式</text>
<path class="edge" d="M295 270C320 270 325 190 380 190"/><path class="edge" d="M295 360H380"/><path class="edge" d="M295 450C320 450 325 550 380 550"/>
<text x="400" y="150" class="label">MCTS：搜尋統計</text><rect class="green" x="400" y="170" width="175" height="55" rx="12"/><text x="487" y="206" text-anchor="middle">等價路徑</text><path class="edge" d="M580 198H650"/><text x="675" y="190">獎勵、訪問資訊</text><text x="675" y="225">同步回報</text>
<text x="400" y="330" class="label">DRL：學習目標</text><rect class="node" x="400" y="350" width="175" height="55" rx="12"/><text x="487" y="386" text-anchor="middle">等價序列</text><path class="edge" d="M580 378H650"/><text x="675" y="370">同獎勵分組</text><text x="675" y="405">計算梯度估計</text>
<text x="400" y="510" class="label">LLM：下一輪提示</text><rect x="400" y="530" width="175" height="55" rx="12" fill="#fcf8ec" stroke="#a78a4a" stroke-width="2"/><text x="487" y="566" text-anchor="middle">等價公式</text><path class="edge" d="M580 558H650"/><text x="675" y="550">增加回饋內容</text><text x="675" y="585">不是直接改權重</text>
<text x="35" y="657" class="small">表達式與規則必須相容；這不是讓所有神經符號迴歸模型都能即插即用。</text>
</svg>
