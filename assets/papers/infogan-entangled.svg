<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 450" role="img" aria-labelledby="title desc"><title id="title">互資訊不保證語意解耦</title><desc id="desc">可逆混合兩碼，仍能完全回猜，卻每碼同時改變旋轉與筆寬。</desc><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#17324d} .small{font-size:18px} .box{fill:#eef6fc;stroke:#5484aa;stroke-width:2} .line{stroke:#456882;stroke-width:3;fill:none}</style><rect width="810" height="450" fill="#fff"/><text x="30" y="40" class="">能猜回兩個旋鈕，也可以仍然混纏（自編反例）</text><rect x="30" y="90" width="345" height="175" rx="12" class="box"/><text x="50" y="125" class="">旋鈕 a、b</text><text x="50" y="175" class="">旋轉 θ = a + b</text><text x="50" y="215" class="">筆寬偏移 w = a − b</text><rect x="420" y="90" width="345" height="175" rx="12" class="box"/><text x="440" y="125" class="">從影像讀回 θ、w</text><text x="440" y="175" class="">a = (θ + w) ÷ 2</text><text x="440" y="215" class="">b = (θ − w) ÷ 2</text><text x="385" y="180" class="">→</text><text x="30" y="315" class="">只轉 a：旋轉與筆寬一起變。只轉 b：兩者也一起變。</text><text x="30" y="360" class="">資訊沒有丟失，但單一旋鈕不是單一人類語意。</text><text x="30" y="405" class="small">教學示意：限定有限範圍、筆寬另加正的基準值；不代表模型實驗。</text></svg>