<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 475" role="img" aria-labelledby="title desc"><title id="title">生成器、回猜器與判別器的兩條支線</title><desc id="desc">z與c進入G，生成影像分送Q猜c與D判真偽。真實影像只送D。</desc><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#17324d} .small{font-size:18px} .box{fill:#eef6fc;stroke:#5484aa;stroke-width:2} .line{stroke:#456882;stroke-width:3;fill:none}</style><rect width="950" height="475" fill="#fff"/><text x="25" y="35" class="">兩項任務：影像像真資料，還要能猜回生成用的碼</text><rect x="30" y="110" width="170" height="95" rx="12" class="box"/><text x="45" y="145" class="">雜訊 z</text><text x="45" y="175" class="">潛在碼 c</text><rect x="265" y="110" width="140" height="95" rx="12" class="box"/><text x="280" y="145" class="">G 生成器</text><text x="280" y="175" class="">畫出影像</text><rect x="470" y="110" width="155" height="95" rx="12" class="box"/><text x="485" y="145" class="">生成影像 x</text><text x="485" y="175" class="">送兩條支線</text><rect x="700" y="70" width="205" height="90" rx="12" class="box"/><text x="715" y="105" class="">Q 輔助網路</text><text x="715" y="135" class="">從影像猜回 c</text><rect x="700" y="245" width="205" height="90" rx="12" class="box"/><text x="715" y="280" class="">D 判別器</text><text x="715" y="310" class="">判斷真或假</text><rect x="470" y="300" width="155" height="85" rx="12" class="box"/><text x="485" y="335" class="">真實資料</text><text x="485" y="365" class="">只送給 D</text><path d="M200 155 H265" class="line"/><path d="M405 155 H470" class="line"/><path d="M625 145 H665 V115 H700" class="line"/><path d="M625 175 H665 V290 H700" class="line"/><path d="M625 340 H655 V315 H700" class="line"/><text x="45" y="245" class="small">已知採樣的 c 是 Q 的練習答案</text><text x="45" y="275" class="small">不是圖片上的旋轉／筆寬人工標籤</text><text x="30" y="440" class="small">教學示意：Q 與 D 目的不同，原實作多數實驗共享卷積特徵層。</text></svg>