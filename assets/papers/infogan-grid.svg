<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">兩個碼的二維掃描</title><desc id="desc">九個手畫數字7，三列為不同傾角，三欄為不同筆寬。不是模型輸出。</desc><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#17324d} .small{font-size:18px} .box{fill:#eef6fc;stroke:#5484aa;stroke-width:2} .line{stroke:#456882;stroke-width:3;fill:none}</style><rect width="800" height="650" fill="#fff"/><text x="30" y="35" class="">固定同一字形與雜訊，只掃描兩個碼（手畫教學示意）</text><text x="245" y="80" class="">欄：碼 B → 筆寬由細到粗</text><text x="235" y="115" class="">B=-1</text><text x="425" y="115" class="">B=0</text><text x="615" y="115" class="">B=1</text><text x="20" y="200" class="">A=-1</text><text x="20" y="230" class="small">-22°</text><rect x="180" y="145" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(257 203) rotate(-22)" stroke="#24587b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="370" y="145" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(447 203) rotate(-22)" stroke="#24587b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="560" y="145" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(637 203) rotate(-22)" stroke="#24587b" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="20" y="335" class="">A=0</text><text x="20" y="365" class="small">0°</text><rect x="180" y="280" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(257 338) rotate(0)" stroke="#24587b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="370" y="280" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(447 338) rotate(0)" stroke="#24587b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="560" y="280" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(637 338) rotate(0)" stroke="#24587b" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="20" y="470" class="">A=1</text><text x="20" y="500" class="small">22°</text><rect x="180" y="415" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(257 473) rotate(22)" stroke="#24587b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="370" y="415" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(447 473) rotate(22)" stroke="#24587b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="560" y="415" width="155" height="115" rx="12" class="box"/><path d="M -25 -32 L 25 -32 L -7 36" transform="translate(637 473) rotate(22)" stroke="#24587b" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="30" y="590" class="small">列：碼 A → 傾斜；這些語意是示意指定，真實模型要訓練後觀察。</text><text x="30" y="620" class="small">非 InfoGAN 生成樣本；原論文圖 2 每次只掃一個碼，本文合成二維比較。</text></svg>