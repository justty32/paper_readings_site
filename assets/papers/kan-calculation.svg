<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">KAN：手算主例，沿邊算出 49</title><desc id="desc">x等於2經平方邊得到4，y等於3經恆等邊得到3，隱藏節點相加得到7；輸出邊平方得到49，輸出節點只有一個輸入，值為49。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">KAN：手算主例，沿邊算出 49</text><text x="30" y="85" font-size="23" fill="#172d38" text-anchor="start">手算主例：f(x,y) = (x² + y)²</text><rect x="35" y="125" width="135" height="70" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="60" y="169" font-size="28" fill="#172d38" text-anchor="start">x = 2</text><rect x="35" y="285" width="135" height="70" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="60" y="329" font-size="28" fill="#172d38" text-anchor="start">y = 3</text><path d="M175 160 L420 220" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="148" font-size="22" fill="#172d38" text-anchor="start">邊：φ₁(t)=t²</text><text x="225" y="183" font-size="25" fill="#172d38" text-anchor="start">2² = 4</text><path d="M175 320 L420 260" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="310" font-size="22" fill="#172d38" text-anchor="start">邊：φ₂(t)=t</text><text x="225" y="346" font-size="25" fill="#172d38" text-anchor="start">原值 3</text><rect x="425" y="195" width="155" height="95" rx="16" fill="#eff3df" stroke="#b7c5be"/><text x="448" y="232" font-size="21" fill="#172d38" text-anchor="start">節點：相加</text><text x="445" y="268" font-size="22" fill="#172d38" text-anchor="start">h = 4+3 = 7</text><path d="M585 242 L735 242" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="605" y="194" font-size="21" fill="#172d38" text-anchor="start">邊：ψ(t)=t²</text><text x="625" y="282" font-size="25" fill="#172d38" text-anchor="start">7² = 49</text><rect x="740" y="202" width="125" height="80" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="760" y="233" font-size="18" fill="#172d38" text-anchor="start">輸出節點</text><text x="783" y="268" font-size="30" fill="#172d38" text-anchor="start">49</text><text x="40" y="406" font-size="24" fill="#172d38" text-anchor="start">平方都在邊上；節點只把收到的值相加。</text><text x="40" y="441" font-size="22" fill="#172d38" text-anchor="start">把最後一條邊換成 ψ(t)=t，輸出就變 7。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>