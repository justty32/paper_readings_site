<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">KAN：四個獨立檢查站</title><desc id="desc">以無方向分支分開四個未知檢查站。表示存在須連續等前提；樣條近似須平滑邊表示；訓練是否找到須實測最佳化；新資料泛化須保留資料檢驗。前一項不自動推出下一項。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">KAN：四個獨立檢查站</text><text x="30" y="80" font-size="22" fill="#172d38" text-anchor="start">四個問題分別查證；這裡沒有「一路保證成功」的箭頭。</text><path d="M450 105 V127 M215 127 H685 M215 127 V147 M685 127 V147 M450 294 V303 M215 303 H685 M215 303 V323 M685 303 V323" fill="none" stroke="#9aaba2" stroke-width="2"/><circle cx="58" cy="176" r="22" fill="#d5f27c"/><text x="58" y="184" font-size="28" fill="#172d38" text-anchor="middle">?</text><text x="90" y="183" font-size="25" fill="#172d38" text-anchor="start">表示存在？</text><text x="42" y="220" font-size="19" fill="#172d38" text-anchor="start">前提：指定有界區域、連續目標</text><text x="42" y="252" font-size="19" fill="#172d38" text-anchor="start">一維函式可組合；可能不平滑</text><circle cx="493" cy="176" r="22" fill="#d5f27c"/><text x="493" y="184" font-size="28" fill="#172d38" text-anchor="middle">?</text><text x="525" y="183" font-size="25" fill="#172d38" text-anchor="start">樣條近似多好？</text><text x="477" y="220" font-size="19" fill="#172d38" text-anchor="start">前提：已有足夠平滑的邊函式表示</text><text x="477" y="252" font-size="19" fill="#172d38" text-anchor="start">定理 2.1；有限網格與常數仍要查</text><circle cx="58" cy="352" r="22" fill="#d5f27c"/><text x="58" y="360" font-size="28" fill="#172d38" text-anchor="middle">?</text><text x="90" y="359" font-size="25" fill="#172d38" text-anchor="start">訓練找得到？</text><text x="42" y="396" font-size="19" fill="#172d38" text-anchor="start">前提：有限樣本、架構與搜尋預算</text><text x="42" y="428" font-size="19" fill="#172d38" text-anchor="start">需實際最佳化；存在不等於找到</text><circle cx="493" cy="352" r="22" fill="#d5f27c"/><text x="493" y="360" font-size="28" fill="#172d38" text-anchor="middle">?</text><text x="525" y="359" font-size="25" fill="#172d38" text-anchor="start">新資料仍準？</text><text x="477" y="396" font-size="19" fill="#172d38" text-anchor="start">前提：保留資料與明確輸入範圍</text><text x="477" y="428" font-size="19" fill="#172d38" text-anchor="start">需測泛化；訓練誤差小仍不足</text><text x="30" y="278" font-size="23" fill="#172d38" text-anchor="start">各站需自己的證據；前一項成立，不自動推出下一項。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>