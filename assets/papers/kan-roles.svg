<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">KAN 與 MLP：誰負責非線性？</title><desc id="desc">MLP 邊做線性加權，節點做加權和、偏置與固定非線性；KAN 邊做可學一維函式，節點相加。這是基本角色比較，不宣稱 KAN 一定較省成本。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">KAN 與 MLP：誰負責非線性？</text><rect x="30" y="90" width="405" height="330" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="55" y="130" font-size="25" fill="#172d38" text-anchor="start">MLP：非線性在節點</text><text x="55" y="176" font-size="24" fill="#172d38" text-anchor="start">輸入 x、y</text><path d="M130 190 L130 220" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="252" font-size="22" fill="#172d38" text-anchor="start">邊乘線性權重：2x、−3y</text><text x="55" y="293" font-size="22" fill="#172d38" text-anchor="start">節點先相加，加偏置 +1</text><text x="55" y="334" font-size="22" fill="#172d38" text-anchor="start">再做固定非線性 ReLU</text><text x="55" y="387" font-size="23" fill="#172d38" text-anchor="start">h = ReLU(2x − 3y + 1)</text><rect x="465" y="90" width="405" height="330" rx="16" fill="#eff3df" stroke="#b7c5be"/><text x="490" y="130" font-size="25" fill="#172d38" text-anchor="start">KAN：非線性在邊</text><text x="490" y="176" font-size="24" fill="#172d38" text-anchor="start">輸入 x、y</text><path d="M565 190 L565 220" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="252" font-size="22" fill="#172d38" text-anchor="start">每條邊各套可學一維函式</text><text x="490" y="293" font-size="21" fill="#172d38" text-anchor="start">例如 φ₁(x)=x²、φ₂(y)=y</text><text x="490" y="334" font-size="22" fill="#172d38" text-anchor="start">節點只相加</text><text x="490" y="387" font-size="23" fill="#172d38" text-anchor="start">h = φ₁(x) + φ₂(y)</text><text x="30" y="446" font-size="21" fill="#172d38" text-anchor="start">圖只比較基本單位；曲線較自由，也有儲存與計算成本。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>