<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">ReAct：候選名稱不是身分證明</title><desc id="desc">虛構例中先查到晨光 2008 年；海灣無相符頁時取得候選，再確認候選的簡稱與 2013 年。證據完整才比較；否則繼續查或承認不足。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">ReAct：候選名稱不是身分證明</text><text x="30" y="80" font-size="20" fill="#536873" text-anchor="start">虛構名稱、年份與回傳；不是實際工具紀錄。</text><rect x="30" y="100" width="840" height="82" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="50" y="130" font-size="23" fill="#172d38" text-anchor="start">1  先取得晨光年份</text><text x="70" y="163" font-size="21" fill="#172d38" text-anchor="start">lookup[成立] → 晨光：2008 年</text><rect x="30" y="195" width="840" height="82" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="50" y="225" font-size="23" fill="#172d38" text-anchor="start">2  海灣找不到完全相符頁面</text><text x="70" y="258" font-size="21" fill="#172d38" text-anchor="start">search[海灣研究室] → 候選：海灣人工智慧研究室</text><rect x="30" y="290" width="840" height="82" rx="16" fill="#eff3df" stroke="#b7c5be"/><text x="50" y="320" font-size="23" fill="#172d38" text-anchor="start">3  再查候選，先確認身分</text><text x="70" y="353" font-size="21" fill="#172d38" text-anchor="start">候選頁說明「簡稱海灣研究室」，且列出 2013 年</text><text x="35" y="411" font-size="23" fill="#172d38" text-anchor="start">確認兩個實體與年份後，才比較：2013 − 2008 = 5 年</text><text x="35" y="442" font-size="20" fill="#172d38" text-anchor="start">若簡稱未獲確認：繼續找證據或回報不足，不能照抄結論。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>