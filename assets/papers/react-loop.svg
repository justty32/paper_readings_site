<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">ReAct：模型提議，工具帶回新證據</title><desc id="desc">Thought 與 Action 由模型產生，Observation 必須是工具實際回傳。回傳進入歷史後影響下一步；finish 回答並停止。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">ReAct：模型提議，工具帶回新證據</text><rect x="40" y="85" width="385" height="120" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="60" y="120" font-size="24" fill="#172d38" text-anchor="start">Thought｜模型整理線索</text><text x="60" y="158" font-size="21" fill="#172d38" text-anchor="start">「還缺成立年份，先查本頁。」</text><text x="60" y="189" font-size="18" fill="#172d38" text-anchor="start">文字本身不會打開工具</text><path d="M430 145 L475 145" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="85" width="375" height="120" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="505" y="120" font-size="24" fill="#172d38" text-anchor="start">Action｜模型提出操作</text><text x="505" y="158" font-size="24" fill="#172d38" text-anchor="start">lookup[成立]</text><text x="505" y="189" font-size="18" fill="#172d38" text-anchor="start">執行器解析、檢查並呼叫工具</text><path d="M675 210 L675 260" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="270" width="375" height="120" rx="16" fill="#eff3df" stroke="#b7c5be"/><text x="505" y="305" font-size="24" fill="#172d38" text-anchor="start">Observation｜工具回傳</text><text x="505" y="343" font-size="22" fill="#172d38" text-anchor="start">把實際回傳加入歷史</text><text x="505" y="375" font-size="18" fill="#172d38" text-anchor="start">不能由模型自行補寫成證據</text><path d="M480 330 L425 330" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="270" width="385" height="120" rx="16" fill="#fffef8" stroke="#b7c5be"/><text x="60" y="305" font-size="24" fill="#172d38" text-anchor="start">下一次 Thought</text><text x="60" y="343" font-size="22" fill="#172d38" text-anchor="start">新證據 → 修改下一步</text><text x="60" y="375" font-size="20" fill="#172d38" text-anchor="start">資訊足夠：finish[答案] → 停止</text><path d="M230 265 L230 210" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="434" font-size="22" fill="#172d38" text-anchor="start">finish 是終止操作；不另捏造一個 Observation。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>