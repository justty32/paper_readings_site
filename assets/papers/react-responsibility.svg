<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">ReAct：三個角色，三種證據</title><desc id="desc">三泳道呈現模型提議search，執行器實際呼叫工具，外部頁面回傳內容，執行器把Observation交回模型讀取。提議不能證明執行，呼叫不能證明答案正確，頁面內容不能證明絕對真實。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#426e63" stroke-width="1.5"/></marker></defs><rect width="900" height="500" rx="22" fill="#f5f4ec"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="28" fill="#172d38" text-anchor="start">ReAct：三個角色，三種證據</text><rect x="30" y="80" width="260" height="345" fill="#fffef8"/><text x="160" y="113" font-size="25" fill="#172d38" text-anchor="middle">模型</text><path d="M160 130 V310" stroke="#b7c5be" stroke-dasharray="6 5"/><rect x="320" y="80" width="260" height="345" fill="#eff3df"/><text x="450" y="113" font-size="25" fill="#172d38" text-anchor="middle">執行器</text><path d="M450 130 V310" stroke="#b7c5be" stroke-dasharray="6 5"/><rect x="610" y="80" width="260" height="345" fill="#fffef8"/><text x="740" y="113" font-size="25" fill="#172d38" text-anchor="middle">外部頁面</text><path d="M740 130 V310" stroke="#b7c5be" stroke-dasharray="6 5"/><text x="45" y="154" font-size="21" fill="#172d38" text-anchor="start">① 提議 search[名稱]</text><path d="M175 169 L430 194" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="184" font-size="21" fill="#172d38" text-anchor="start">② 實際工具呼叫</text><path d="M450 208 L725 229" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="220" font-size="21" fill="#172d38" text-anchor="start">③ 取得頁面</text><text x="630" y="251" font-size="21" fill="#172d38" text-anchor="start">頁面回傳內容</text><path d="M725 266 L455 284" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><path d="M435 288 L180 307" fill="none" stroke="#426e63" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="306" font-size="20" fill="#172d38" text-anchor="start">④ 讀取 Observation</text><text x="45" y="350" font-size="19" fill="#172d38" text-anchor="start">可證明：提出此動作</text><text x="45" y="386" font-size="19" fill="#172d38" text-anchor="start">不能證明：已執行</text><text x="335" y="350" font-size="19" fill="#172d38" text-anchor="start">可證明：呼叫與參數</text><text x="335" y="386" font-size="19" fill="#172d38" text-anchor="start">不能證明：答案正確</text><text x="625" y="350" font-size="18" fill="#172d38" text-anchor="start">可核對：頁面寫了什麼</text><text x="625" y="386" font-size="19" fill="#172d38" text-anchor="start">不能證明：絕對真實</text><text x="30" y="452" font-size="20" fill="#172d38" text-anchor="start">還要核對頁面身分、資料可信度與模型是否讀對；用了工具仍可能錯。</text><text x="30" y="476" font-size="18" fill="#536873" text-anchor="start">自製教學示意，非原論文實驗</text></g></svg>