<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc"><title id="title">評估器誤判支線與測試覆蓋邊界</title><desc id="desc">完整評估發現位置錯誤而啟動反思；只查乾淨會誤判成功；類比程式測試可能漏案例。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#456778"/></marker></defs><rect width="1040" height="690" fill="#f4f8fb" rx="24"/><g font-family="sans-serif" font-size="22" fill="#17344b"><text x="36" y="48" font-size="28">若評估器漏檢，反思也可能沒有機會發生</text><text x="36" y="85" font-size="20">自編教學示意；不是論文誤判比例圖</text><rect x="36" y="115" width="968" height="75" rx="14" fill="#dce9f3"/><text x="56" y="162" font-size="22">第一次結束：杯子乾淨，但仍在水槽旁。</text><path d="M380 196L270 245" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><path d="M660 196L770 245" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="260" width="460" height="180" rx="14" fill="#cee5d9"/><text x="56" y="301" font-size="24">完整評估：查兩條件</text><text x="56" y="344" font-size="22">乾淨 ✓　在櫃內 ✗</text><text x="56" y="386" font-size="22">判失敗 → 反思 → 下一次改動作</text><rect x="520" y="260" width="484" height="180" rx="14" fill="#f3dfd4"/><text x="540" y="301" font-size="24">漏檢支線：只查乾淨</text><text x="540" y="344" font-size="22">乾淨 ✓　位置沒有檢查</text><text x="540" y="386" font-size="22">誤判成功 → 停止，錯誤未修復</text><rect x="36" y="480" width="968" height="120" rx="14" fill="#e3deef"/><text x="56" y="520" font-size="22">程式測試也有同樣邊界：</text><text x="56" y="558" font-size="20">已測案例通過 ≠ 所有可能輸入都正確；漏測不能靠反思證明。</text><text x="36" y="641" font-size="20">Evaluator 可來自內部或外部；可靠度要看實際檢查內容。</text></g></svg>