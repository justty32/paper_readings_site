<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc"><title id="title">Actor評估反思與記憶迴圈</title><desc id="desc">Actor產生軌跡交給Evaluator；失敗送Reflection寫入記憶，重置後讀回；成功則停止。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#456778"/></marker></defs><rect width="1040" height="670" fill="#f4f8fb" rx="24"/><g font-family="sans-serif" font-size="22" fill="#17344b"><text x="36" y="48" font-size="28">失敗不是終點：把回饋寫入記憶，再重試</text><text x="36" y="85" font-size="20">教學示意；模型權重不變，改的是下一次讀到的脈絡</text><rect x="36" y="140" width="280" height="112" rx="14" fill="#dce9f3"/><text x="52" y="180" font-size="22">Actor：做事</text><text x="52" y="220" font-size="20">讀任務、記憶與觀察</text><rect x="380" y="140" width="280" height="112" rx="14" fill="#dce9f3"/><text x="396" y="180" font-size="22">Evaluator：檢查</text><text x="396" y="220" font-size="20">對照完整成功條件</text><rect x="724" y="140" width="280" height="112" rx="14" fill="#dce9f3"/><text x="740" y="180" font-size="22">Reflection：寫教訓</text><text x="740" y="220" font-size="20">對照過程找可行改法</text><path d="M320 196L368 196" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><path d="M664 196L712 196" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><text x="672" y="126" font-size="20">失敗</text><path d="M864 258L864 340" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><rect x="724" y="350" width="280" height="108" rx="14" fill="#d0e6db"/><text x="744" y="391" font-size="22">有限記憶 mem</text><text x="744" y="431" font-size="20">通常保留 1–3 條</text><path d="M724 405H176V264" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><text x="270" y="390" font-size="22">保留教訓 → 重置環境 → 下次讀回</text><path d="M520 258L520 485" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><rect x="380" y="495" width="280" height="70" rx="14" fill="#cde7d8"/><text x="408" y="539" font-size="22">成功 → 停止</text><text x="36" y="625" font-size="20">重試需有預算；記憶不是無限容量或永久跨任務技能。</text></g></svg>