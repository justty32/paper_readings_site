<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc"><title id="title">兩次洗杯嘗試與記憶差異</title><desc id="desc">第一次漏放櫃子失敗；保留具體便條並重置環境；第二次增加放櫃內與確認動作。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#456778"/></marker></defs><rect width="1040" height="670" fill="#f4f8fb" rx="24"/><g font-family="sans-serif" font-size="22" fill="#17344b"><text x="36" y="48" font-size="27">同一任務重來：留下教訓，不沿用已洗好的杯子</text><text x="36" y="85" font-size="20">自編教學示意；目標必須同時符合乾淨與在櫃內</text><rect x="36" y="120" width="968" height="150" rx="14" fill="#f4e1d7"/><text x="56" y="158" font-size="24">嘗試一：沒有「漏放櫃子」的教訓</text><text x="56" y="203" font-size="22">髒／水槽旁 → 拿取 → 清洗 → 留在水槽旁</text><text x="56" y="243" font-size="22">乾淨 ✓　位置 ✗　→ 失敗，不能只說「下次小心」</text><path d="M520 277L520 312" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="322" width="968" height="85" rx="14" fill="#e1dbee"/><text x="56" y="355" font-size="22">記憶便條：洗好後放櫃內，再確認乾淨與位置。</text><text x="56" y="389" font-size="20">環境重置：杯子回到髒／水槽旁；便條保留。</text><path d="M520 414L520 449" fill="none" stroke="#456778" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="459" width="968" height="150" rx="14" fill="#cfe6da"/><text x="56" y="496" font-size="24">嘗試二：讀回便條，再做一次</text><text x="56" y="541" font-size="22">髒／水槽旁 → 拿取 → 清洗 → 放櫃內 → 確認</text><text x="56" y="582" font-size="22">乾淨 ✓　位置 ✓　→ 成功停止；不保證每次都會如此</text></g></svg>