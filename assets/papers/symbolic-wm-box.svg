<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 410" role="img" aria-labelledby="title desc"><title id="title">箱子輪胎狀態轉移</title><desc id="desc">正確路徑先開箱再拿輪胎，紅線表示錯模型允許的直接拿取捷徑。</desc><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#17324d} .small{font-size:18px} .box{fill:#eef6fc;stroke:#5484aa;stroke-width:2} .line{stroke:#456882;stroke-width:3;fill:none} .bad{fill:#a32c33} .good{fill:#126449}</style><rect width="950" height="410" fill="#fff"/><text x="25" y="35" class="">箱子先開，才能拿輪胎（自編教學示意）</text><rect x="25" y="85" width="240" height="110" rx="12" class="box"/><text x="41" y="120" class="">起點：箱子關閉</text><text x="41" y="152" class="">輪胎在箱內</text><rect x="345" y="85" width="240" height="110" rx="12" class="box"/><text x="361" y="120" class="">開箱後：箱子開啟</text><text x="361" y="152" class="">輪胎仍在箱內</text><rect x="665" y="85" width="240" height="110" rx="12" class="box"/><text x="681" y="120" class="">拿取後：箱子開啟</text><text x="681" y="152" class="">輪胎已拿到</text><text x="280" y="145" class="">開箱 →</text><text x="600" y="145" class="">拿取 →</text><path d="M145 215 V280 H785 V215" stroke="#b3313a" stroke-width="4" fill="none"/><text x="230" y="270" class="bad">錯誤捷徑：關著箱子直接拿輪胎</text><text x="30" y="335" class="small">錯規則：拿取要求 closed；修正：拿取要求 not closed。</text><text x="30" y="375" class="small">規劃器只遵守寫進模型的規則，不會自行知道箱蓋擋住手。</text></svg>