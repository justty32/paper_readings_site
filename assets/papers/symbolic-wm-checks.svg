<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="title desc"><title id="title">形式驗證與語意忠實兩道關卡</title><desc id="desc">一份語法一致但拿取前提顛倒的模型，可接受模型內計畫，卻違反原描述。</desc><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#17324d} .small{font-size:18px} .box{fill:#eef6fc;stroke:#5484aa;stroke-width:2} .line{stroke:#456882;stroke-width:3;fill:none} .bad{fill:#a32c33} .good{fill:#126449}</style><rect width="940" height="440" fill="#fff"/><text x="25" y="35" class="">兩道獨立問題：模型內有效，還是忠於描述？</text><rect x="25" y="80" width="395" height="190" rx="12" class="box"/><text x="41" y="115" class="">關卡 A：形式與模型內有效性</text><text x="41" y="147" class="">語法、型別、動作前提與效果</text><text x="41" y="179" class="">錯規則：關箱才可拿輪胎</text><text x="41" y="211" class="">錯模型中的「直接拿」可通過</text><rect x="470" y="80" width="425" height="190" rx="12" class="box"/><text x="486" y="115" class="">關卡 B：是否符合原始描述？</text><text x="486" y="147" class="">描述：先開箱才能拿輪胎</text><text x="486" y="179" class="">錯規則顛倒這個前提</text><text x="486" y="211" class="">因此不忠於描述，不能算正確</text><text x="40" y="310" class="bad">關卡 A 通過 ≠ 關卡 B 通過</text><text x="40" y="355" class="">VAL 不驗意圖語意；LLM 批評也不是可靠真值來源。</text><text x="40" y="400" class="small">自編教學示意：此處假設錯 domain 已修到語法一致、計畫可執行。</text></svg>