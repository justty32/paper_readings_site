<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 430" role="img" aria-labelledby="title desc"><title id="title">BoN初始化與iVML文字精修</title><desc id="desc">候選依token對數概似挑起點，再對照描述、批評及更新domain，形成迴圈。</desc><style>text{font-family:system-ui,sans-serif;font-size:20px;fill:#17324d} .small{font-size:18px} .box{fill:#eef6fc;stroke:#5484aa;stroke-width:2} .line{stroke:#456882;stroke-width:3;fill:none} .bad{fill:#a32c33} .good{fill:#126449}</style><rect width="990" height="430" fill="#fff"/><text x="25" y="35" class="">先找起點，再逐輪改規則文字（依原文圖 1 重畫）</text><rect x="25" y="80" width="240" height="120" rx="12" class="box"/><text x="41" y="115" class="">原始描述</text><text x="41" y="147" class="">→ 多份 PDDL 候選</text><text x="41" y="179" class="">BoN：平行取樣</text><rect x="345" y="80" width="285" height="120" rx="12" class="box"/><text x="361" y="115" class="">以 token 對數概似排序</text><text x="361" y="147" class="">選 top-K 當起點</text><text x="361" y="179" class="">分數不是正確性證明</text><rect x="700" y="80" width="245" height="120" rx="12" class="box"/><text x="716" y="115" class="">當前 domain</text><text x="716" y="147" class="">與原始描述對照</text><text x="716" y="179" class="">optimizer 提批評</text><text x="280" y="145" class="">→</text><text x="650" y="145" class="">→</text><rect x="700" y="270" width="245" height="95" rx="12" class="box"/><text x="716" y="305" class="">learner 依批評更新</text><text x="716" y="337" class="">domain 與說明文字</text><path d="M825 205 V265 M695 315 H650 V145 H695" class="line"/><text x="25" y="285" class="">iVML：批評與更新是分開的 LLM 呼叫</text><text x="25" y="325" class="">修改文字模型，不更新 LLM 權重</text><text x="25" y="390" class="small">教學示意：LLM 批評可能出錯；額外取樣與迭代仍花費計算。</text></svg>