<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc"><title id="title">三種損失與篩選門檻</title><desc id="desc">比例柱依3.0、2.8與1.2繪製；改善1.6大於示意門檻1.0而保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#49677b"/></marker></defs><rect width="1040" height="610" rx="24" fill="#f5f8fb"/><g font-family="sans-serif" fill="#19344b" font-size="22"><text x="36" y="48" font-size="28">不是「有呼叫就好」：結果要帶來額外幫助</text><text x="36" y="86" font-size="20">自編比例柱：數值與門檻皆為教學示意；損失越低越好</text><text x="36" y="162" font-size="22">不呼叫</text><rect x="270" y="135" width="540.0" height="46" rx="6" fill="#7996af"/><text x="840" y="165" font-size="26">3.0</text><text x="36" y="252" font-size="22">呼叫、無結果</text><rect x="270" y="225" width="503.99999999999994" height="46" rx="6" fill="#8aa5bb"/><text x="840" y="255" font-size="26">2.8</text><text x="36" y="342" font-size="22">呼叫＋126結果</text><rect x="270" y="315" width="216.0" height="46" rx="6" fill="#3e927b"/><text x="840" y="345" font-size="26">1.2</text><rect x="36" y="405" width="968" height="120" rx="14" fill="#e2edf5"/><text x="56" y="443" font-size="22">無結果基準：min(3.0, 2.8) = 2.8</text><text x="56" y="481" font-size="22">改善：2.8 − 1.2 = 1.6 ≥ 門檻 1.0 → 保留</text><text x="36" y="565" font-size="20">只測後續文字預測效用；不是工具或答案的真實正確證明。</text></g></svg>