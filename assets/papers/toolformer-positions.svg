<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc"><title id="title">工具候選插入位置</title><desc id="desc">答案前可試乘法或加法候選；都須執行並篩選。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#49677b"/></marker></defs><rect width="1040" height="590" rx="24" fill="#f5f8fb"/><g font-family="sans-serif" fill="#19344b" font-size="22"><text x="36" y="48" font-size="28">候選插入：先知道文字，再找有用的查詢時機</text><text x="36" y="86" font-size="20">自編教學示意；糖果、呼叫候選均非原文實驗</text><rect x="36" y="115" width="968" height="78" rx="14" fill="#e2edf5"/><text x="60" y="163" font-size="27">有 7 袋，每袋 18 顆，共　│　126 顆。</text><path d="M477 190L477 225" fill="none" stroke="#49677b" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="235" width="460" height="110" rx="14" fill="#e2edf5"/><text x="56" y="273" font-size="22">候選 A：答案之前</text><text x="56" y="313" font-size="22">Calculator(7 * 18) → 126</text><rect x="520" y="235" width="484" height="110" rx="14" fill="#f4e5da"/><text x="540" y="273" font-size="22">候選 B：相同位置，另一算式</text><text x="540" y="313" font-size="22">Calculator(7 + 18) → 25</text><rect x="36" y="375" width="968" height="94" rx="14" fill="#e2edf5"/><text x="56" y="411" font-size="22">為何要先當候選？算式合法，不代表能幫上後文。</text><text x="56" y="447" font-size="22">先真正執行，再比較預測「126 顆」的損失。</text><text x="36" y="520" font-size="21">太早：數字還不齊；太晚：已寫出答案，幫不到這個答案。</text></g></svg>