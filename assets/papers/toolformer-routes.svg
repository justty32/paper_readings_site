<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc"><title id="title">訓練與推論雙路圖</title><desc id="desc">上路候選執行篩選微調；下路模型提出呼叫、控制程式執行回填、繼續生成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#49677b"/></marker></defs><rect width="1040" height="610" rx="24" fill="#f5f8fb"/><g font-family="sans-serif" fill="#19344b" font-size="22"><text x="36" y="48" font-size="28">兩條路：製造練習材料，與回答新問題</text><text x="36" y="86" font-size="20">教學示意；訓練會改變權重，回答當下不重跑資料工廠</text><rect x="36" y="115" width="968" height="182" rx="14" fill="#e2edf5"/><text x="56" y="150" font-size="25">訓練資料準備：原文答案 126 已知，用來評分</text><rect x="56" y="185" width="190" height="64" rx="14" fill="#c6e2d7"/><text x="70" y="225" font-size="22">提出候選</text><rect x="294" y="185" width="174" height="64" rx="14" fill="#c6e2d7"/><text x="308" y="225" font-size="22">實際執行</text><rect x="516" y="185" width="174" height="64" rx="14" fill="#c6e2d7"/><text x="530" y="225" font-size="22">損失篩選</text><rect x="738" y="185" width="230" height="64" rx="14" fill="#c6e2d7"/><text x="752" y="225" font-size="22">加料文字微調</text><path d="M252 217L285 217" fill="none" stroke="#49677b" stroke-width="3" marker-end="url(#arrow)"/><path d="M474 217L507 217" fill="none" stroke="#49677b" stroke-width="3" marker-end="url(#arrow)"/><path d="M696 217L729 217" fill="none" stroke="#49677b" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="330" width="968" height="182" rx="14" fill="#e8e2f3"/><text x="56" y="365" font-size="25">回答新問題：不知道答案；等待工具真的回傳</text><rect x="56" y="400" width="190" height="64" rx="14" fill="#d5c9e8"/><text x="68" y="440" font-size="22">模型提呼叫</text><rect x="294" y="400" width="174" height="64" rx="14" fill="#d5c9e8"/><text x="306" y="440" font-size="22">暫停並執行</text><rect x="516" y="400" width="174" height="64" rx="14" fill="#d5c9e8"/><text x="528" y="440" font-size="22">回填 126</text><rect x="738" y="400" width="230" height="64" rx="14" fill="#d5c9e8"/><text x="750" y="440" font-size="22">繼續寫答案</text><path d="M252 432L285 432" fill="none" stroke="#49677b" stroke-width="3" marker-end="url(#arrow)"/><path d="M474 432L507 432" fill="none" stroke="#49677b" stroke-width="3" marker-end="url(#arrow)"/><path d="M696 432L729 432" fill="none" stroke="#49677b" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="562" font-size="20">原實驗：每輸入至多一次呼叫；不代表已學會一般工具鏈。</text></g></svg>