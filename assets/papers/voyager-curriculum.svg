<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">任務有依賴，下一步也要看目前狀態</title><desc id="desc">上排顯示木頭到石鎬的簡化依賴。下排把背包與附近資源交給課程，由課程選擇下一任務。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536980"/></marker></defs><rect width="1000" height="660" rx="22" fill="#f4f7fb"/><g font-family="system-ui,sans-serif" fill="#18334b"><text x="36" y="44" font-size="27" font-weight="700">任務有依賴，下一步也要看目前狀態</text><text x="36" y="78" font-size="19">教學示意；非原論文執行軌跡，不含完整遊戲配方。</text><path d="M240 180 L275 180" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 180 L515 180" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 180 L755 180" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M305 415 L380 415" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M630 415 L705 415" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="120" width="205" height="120" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="154" font-size="22" font-weight="700">取得木頭</text><text x="53" y="184" font-size="19" font-weight="400">省略木板、木棒</text><text x="53" y="214" font-size="19" font-weight="400">與工作臺製作</text><rect x="275" y="120" width="205" height="120" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="293" y="154" font-size="22" font-weight="700">製作木鎬</text><text x="293" y="184" font-size="19" font-weight="400">先有材料</text><text x="293" y="214" font-size="19" font-weight="400">才能做工具</text><rect x="515" y="120" width="205" height="120" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="533" y="154" font-size="22" font-weight="700">採出圓石</text><text x="533" y="184" font-size="19" font-weight="400">木鎬是工具</text><text x="533" y="214" font-size="19" font-weight="400">還需找到石頭</text><rect x="755" y="120" width="205" height="120" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="773" y="154" font-size="22" font-weight="700">製作石鎬</text><text x="773" y="184" font-size="19" font-weight="400">再組合材料</text><text x="773" y="214" font-size="19" font-weight="400">取得新工具</text><rect x="55" y="330" width="250" height="170" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="73" y="364" font-size="22" font-weight="700">當前狀態</text><text x="73" y="394" font-size="19" font-weight="400">空背包／已有木鎬</text><text x="73" y="424" font-size="19" font-weight="400">附近有樹／石頭</text><text x="73" y="454" font-size="19" font-weight="400">已完成與失敗任務</text><rect x="380" y="330" width="250" height="170" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="398" y="364" font-size="22" font-weight="700">自動課程</text><text x="398" y="394" font-size="19" font-weight="400">讀狀態與探索進度</text><text x="398" y="424" font-size="19" font-weight="400">選合適的新挑戰</text><text x="398" y="454" font-size="19" font-weight="400">不是固定清單</text><rect x="705" y="330" width="250" height="170" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="723" y="364" font-size="22" font-weight="700">下一任務</text><text x="723" y="394" font-size="19" font-weight="400">空手時：先採木</text><text x="723" y="424" font-size="19" font-weight="400">有木鎬、有石頭：</text><text x="723" y="454" font-size="19" font-weight="400">可改選採石</text><text x="36" y="570" font-size="19">假設附近可取得所需資源，沒有敵人干擾；中間製作刻意省略。</text><text x="36" y="600" font-size="19">方法定位：原文 2.1、圖 3。</text></g></svg>