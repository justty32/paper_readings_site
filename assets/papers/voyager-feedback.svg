<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">三路回饋，一起幫程式找出下一步</title><desc id="desc">環境回饋、執行錯誤與GPT-4評審的批評流向修碼。再執行後由評審驗證，成功入庫，未成功則修正或四輪後換任務。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536980"/></marker></defs><rect width="1000" height="660" rx="22" fill="#f4f7fb"/><g font-family="system-ui,sans-serif" fill="#18334b"><text x="36" y="44" font-size="27" font-weight="700">三路回饋，一起幫程式找出下一步</text><text x="36" y="78" font-size="19">教學示意；非原論文執行軌跡，不含完整遊戲配方。</text><path d="M295 170 L370 275" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M295 295 L370 295" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M295 430 L370 325" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M610 305 L685 305" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M825 370 L825 430" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="120" width="260" height="100" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="154" font-size="22" font-weight="700">環境回饋</text><text x="53" y="184" font-size="19" font-weight="400">例如：圓石還不夠</text><rect x="35" y="245" width="260" height="100" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="279" font-size="22" font-weight="700">執行錯誤</text><text x="53" y="309" font-size="19" font-weight="400">例如：函式不存在</text><rect x="35" y="370" width="260" height="120" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="53" y="404" font-size="22" font-weight="700">GPT-4 critic 批評</text><text x="53" y="434" font-size="19" font-weight="400">critic 是評審</text><text x="53" y="464" font-size="19" font-weight="400">依狀態檢查任務</text><rect x="370" y="240" width="240" height="130" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="388" y="274" font-size="22" font-weight="700">GPT-4 修改程式</text><text x="388" y="304" font-size="19" font-weight="400">加入三種回饋</text><text x="388" y="334" font-size="19" font-weight="400">再交給環境執行</text><rect x="685" y="240" width="275" height="130" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="703" y="274" font-size="22" font-weight="700">驗證是否完成</text><text x="703" y="304" font-size="19" font-weight="400">有石鎬了嗎？</text><text x="703" y="334" font-size="19" font-weight="400">不只問有沒有報錯</text><rect x="680" y="430" width="280" height="100" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="698" y="464" font-size="22" font-weight="700">通過後：技能入庫</text><text x="698" y="494" font-size="19" font-weight="400">未通過：再改程式</text><text x="36" y="570" font-size="19">四輪程式生成後仍卡住：換任務。原文 2.3、附錄 A.1。</text><text x="36" y="600" font-size="19">critic 會誤判；通過不是形式證明。原文第 4 節。</text></g></svg>