<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">描述用來找，JavaScript 程式用來做</title><desc id="desc">通過驗證的技能以描述向量為檢索鍵，JavaScript程式為值。新任務建議與回饋形成查詢，取回相關技能並組合新程式。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536980"/></marker></defs><rect width="1000" height="660" rx="22" fill="#f4f7fb"/><g font-family="system-ui,sans-serif" fill="#18334b"><text x="36" y="44" font-size="27" font-weight="700">描述用來找，JavaScript 程式用來做</text><text x="36" y="78" font-size="19">教學示意；非原論文執行軌跡，不含完整遊戲配方。</text><path d="M310 190 L375 190" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 190 L700 190" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M310 435 L375 435" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M505 365 L505 260" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 435 L700 435" fill="none" stroke="#536980" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="120" width="270" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="58" y="154" font-size="22" font-weight="700">驗證通過的技能</text><text x="58" y="184" font-size="19" font-weight="400">GPT-3.5 產生描述</text><text x="58" y="214" font-size="19" font-weight="400">embedding 模型</text><text x="58" y="244" font-size="19" font-weight="400">將描述轉成向量</text><rect x="375" y="120" width="260" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="393" y="154" font-size="22" font-weight="700">技能庫：鍵 → 值</text><text x="393" y="184" font-size="19" font-weight="400">鍵：描述的向量</text><text x="393" y="214" font-size="19" font-weight="400">值：可執行 JS 程式</text><rect x="700" y="120" width="260" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="718" y="154" font-size="22" font-weight="700">被保存的是程式</text><text x="718" y="184" font-size="19" font-weight="400">例如：採石行為</text><text x="718" y="214" font-size="19" font-weight="400">不是一段回憶文字</text><rect x="40" y="365" width="270" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="58" y="399" font-size="22" font-weight="700">新任務＋環境回饋</text><text x="58" y="429" font-size="19" font-weight="400">先產生解法建議</text><text x="58" y="459" font-size="19" font-weight="400">形成查詢向量</text><rect x="375" y="365" width="260" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="393" y="399" font-size="22" font-weight="700">檢索相關技能</text><text x="393" y="429" font-size="19" font-weight="400">比較描述向量</text><text x="393" y="459" font-size="19" font-weight="400">取回對應 JS 程式</text><rect x="700" y="365" width="260" height="140" rx="14" fill="white" stroke="#829bb5" stroke-width="2"/><text x="718" y="399" font-size="22" font-weight="700">GPT-4 組合程式</text><text x="718" y="429" font-size="19" font-weight="400">採木＋做木鎬＋採石</text><text x="718" y="459" font-size="19" font-weight="400">生成新任務程式</text><text x="36" y="570" font-size="19">描述向量負責索引；模型參數在這個流程中不更新。</text><text x="36" y="600" font-size="19">原文 2.2、圖 4；檢索相關不保證適用所有新環境。</text></g></svg>